title: Linux Cloud and AI Credential Hunting via Command Line
id: 105eeebb-6e9a-4665-9aab-3770a6d17d7a
status: experimental
description: |
    Detects command lines that read cloud credential files (AWS credentials, gcloud configuration)
    or that search for API key patterns of cloud and AI providers, seed phrases or crypto wallet files.
    Seen on an SSH honeypot on 1 and 2 November 2026: two clients logged in with a weak password.
    One ran "cat ~/.aws/credentials" once an hour. The other ran a script that walks /root, /home,
    /var/www, /opt, /srv and /etc and greps for AKIA, sk-ant-, gsk_, pplx-, AIza, seed_phrase and
    wallet.dat, then dumps environment variables with cloud and AI provider names.
    The rule only sees the command line. It does not see a script read from stdin ("sh -s"),
    an encoded command, or a pattern built from parts.
references:
    - https://www.greynoise.io/blog/threat-actors-actively-targeting-llms
author: Martin Chancalay
date: 2026-11-02
tags:
    - attack.credential-access
    - attack.t1552.001
    - attack.discovery
    - attack.t1083
logsource:
    category: process_creation
    product: linux
detection:
    selection_cloud_files:
        CommandLine|contains:
            - '/.aws/credentials'
            - '/.config/gcloud/'
    selection_key_patterns:
        CommandLine|contains:
            - 'sk-ant-'
            - 'gsk_'
            - 'pplx-'
            - 'seed_phrase'
            - 'mnemonic_phrase'
            - 'wallet.dat'
    selection_key_prefixes_cased:
        CommandLine|contains|cased:
            - 'AKIA['
            - 'ASIA['
            - 'AIza'
    condition: 1 of selection_*
falsepositives:
    - Administrators reading or migrating their own AWS or gcloud credentials
    - Backup tools and provisioning scripts that copy the .aws or gcloud directories
    - Secret scanners and CI jobs that pass key patterns on the command line
level: medium
